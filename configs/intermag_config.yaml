run_config_name: intermag_config # for saving info files/logs # derive from file name?

reparse_info: True # If True, creates new events_dict.json and info.csv when info.py is run

event: ['2024-05-10'] # must have event or start/stop for INTERMAG data only

data_source: ['INTERMAG'] # If specified, only return sites with this data source (e.g., TVA, NERC, SWMF)

exclude_errors: null # If specified, excludes sites with known data issues ('all', 'manual', 'automated', or null)

summary_table: False # If True, creates a summary table of site statistics and metrics

filter_kwargs: # for filter.py, maybe set per event? (filter.yaml with defaults)
  spike_filt_type: 'median' # 'difference' or 'median' or null
  low_signal_threshold: 4 # [A]
  baseline_buffer: 1 # [A]
  spike_threshold: 40 # [A]
  median_window: 20 # [number of points]
  noise_threshold: 4 # [unitless]
  max_cadence: 60 # [s]
  max_gap: 600 # [s]
  max_const: 300 # [s]
# check for other undocumented kwargs lying abt filter.py